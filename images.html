<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">

  <title>Adria Care — Image Board</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1d2a30;
      --ink-soft: #66747a;
      --ground: #f6f4ee;
      --surface: #fdfcf9;
      --line: #d9d4c8;
      --sea: #16566b;
      --gold: #c89b3c;
      --shadow: 0 12px 34px rgba(16, 38, 47, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8e6df;
        --ink-soft: #a9b3b8;
        --ground: #141d21;
        --surface: #1b2529;
        --line: #32414a;
        --sea: #76b7ca;
        --gold: #d3ad58;
        --shadow: 0 14px 38px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; }

    .wrap {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 0 24px 56px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 44px 0 30px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--sea);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(34px, 5vw, 62px);
      font-weight: 600;
      line-height: 1.05;
    }

    .summary {
      max-width: 520px;
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-size: 15px;
    }

    .count {
      flex: 0 0 auto;
      min-width: 132px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: right;
    }

    .count strong {
      display: block;
      color: var(--sea);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      line-height: 1;
    }

    .count span {
      color: var(--ink-soft);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .board {
      columns: 360px 3;
      column-gap: 18px;
    }

    .item {
      display: inline-block;
      width: 100%;
      margin: 0 0 18px;
      overflow: hidden;
      break-inside: avoid;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .image-link {
      display: block;
      overflow: hidden;
      background: linear-gradient(135deg, color-mix(in srgb, var(--sea) 9%, var(--surface)), var(--surface));
    }

    .image-link:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: -3px;
    }

    .image-link img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .image-link:hover img {
      transform: scale(1.012);
      filter: saturate(1.04);
    }

    figcaption {
      display: grid;
      gap: 5px;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
    }

    .file {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 650;
    }

    .usage {
      color: var(--ink-soft);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 13px;
    }

    footer a {
      color: var(--sea);
      font-weight: 650;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .wrap { padding-inline: 14px; }
      header {
        align-items: flex-start;
        flex-direction: column;
        padding-top: 28px;
      }
      .count {
        min-width: 0;
        text-align: left;
      }
      .board { columns: 1; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .image-link img { transition: none; }
    }
  </style>
</head>
